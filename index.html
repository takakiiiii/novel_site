---
layout: default
title: 作品一覧
---

<h1>作品一覧</h1>
<p class="intro">作品タイトルを選ぶと、各話一覧が開きます。</p>

<div class="work-list">
  {% assign sorted_works = site.works | sort: "order" %}
  {% for work in sorted_works %}
    <article class="work-card">
      <h2><a href="{{ work.url | relative_url }}">{{ work.title }}</a></h2>
      {% if work.description %}
        <p>{{ work.description }}</p>
      {% endif %}
    </article>
  {% endfor %}
</div>
