---
layout: default
title: 小説一覧
---

<h1>小説一覧</h1>
<p class="intro">ここに書いた小説を置いています。</p>

<div class="novel-list">
  {% assign sorted_novels = site.novels | sort: "order" %}
  {% for novel in sorted_novels %}
    <article class="novel-card">
      <h2><a href="{{ novel.url | relative_url }}">{{ novel.title }}</a></h2>
      {% if novel.description %}
        <p>{{ novel.description }}</p>
      {% endif %}
    </article>
  {% endfor %}
</div>
